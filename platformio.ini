
; Robot cortacesped - ESP32-S3 + L298N (preparado para IBT-2)
; Usa pioarduino (nucleo Arduino-ESP32 3.x). La primera compilacion descarga todo.
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = symlink://C:/Users/susic/OneDrive/Documentos/platform-espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<*> -<diagnostico/>
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
; USB nativo de Waveshare; libera UART0 (GPIO43/44) para la prueba.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    electroniccats/MPU6050@^1.4.5

[env:test_encoders]
extends = env:esp32s3
; Usa el mismo src/main.cpp y las mismas funciones del programa principal.

; Diagnostico aislado: no compila src/main.cpp ni Robot.cpp/Sensores.cpp.
[env:diagnostico]
extends = env:esp32s3
build_src_filter = -<*> +<diagnostico/> +<MPU.cpp> +<Ultrasonico.cpp> +<MotorControl.cpp>
